<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>DIRT AND SMOKE</title>
<style>
@font-face{font-family:"DSSerif";src:url(../assets/font/NotoSerifJP-400.woff2) format("woff2");font-display:swap}
:root{--ink:#d8d1c5;--dim:#7d776e;--blue:#7899b8;--red:#ad5558;--white:#d8d1c5;--purple:#a987b5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{font-family:"DSSerif","Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:#000}

/* 絵：横画面は画面いっぱい、縦画面は上半分 */
#bg{position:absolute;left:0;right:0;top:0;bottom:0;z-index:1;transition:scale .45s}
#bg.bulge{scale:1.035}
#bg img,#bg .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease,filter 1.1s}
#bg .on{opacity:1}
#bg .ph{background:radial-gradient(ellipse at 50% 40%,#1c1a20,#060507 75%);display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.2em;color:#4a4650}
.f-night{filter:brightness(.55) saturate(.7)} .f-dark{filter:brightness(.38) saturate(.6)} .f-cold{filter:saturate(.22) brightness(.82) contrast(1.06)}
.f-sepia{filter:sepia(.85) blur(1.6px) brightness(.75) contrast(.9)} .f-smoke{filter:brightness(.5) contrast(1.25) saturate(.4) blur(.6px)}
#shade{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 45%,rgba(0,0,0,.82) 70%,#000 100%),
             radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%)}
#ash{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* 文字の窓 */
#win{position:absolute;left:0;right:0;bottom:0;height:36%;z-index:5;padding:0 9vw calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;justify-content:flex-start;font-size:clamp(15px,2.3vw,22px);line-height:1.95;letter-spacing:.05em}
#win.center{top:0;height:auto;justify-content:center;text-align:center}
@media (orientation:portrait){
  #bg{bottom:46%}
  #shade{bottom:46%}
  #win{height:48%;padding:6px 26px calc(40px + env(safe-area-inset-bottom));font-size:17px}
}
.line{opacity:0;animation:fin .45s forwards;white-space:pre-wrap}
@keyframes fin{to{opacity:1}}
.nm{display:block;font-size:.66em;letter-spacing:.3em;color:var(--dim);line-height:1.5;margin-top:.3em}
.ch{opacity:0;animation:fin .22s forwards}
.c-blue{color:var(--blue)} .c-red{color:var(--red)} .c-white{color:var(--white)} .c-purple{color:var(--purple);font-size:1.25em}
.blot{display:inline-block;width:2.1em;height:.95em;vertical-align:-.12em;margin:0 .08em;border-radius:45% 55% 50% 40%;
  background:radial-gradient(ellipse at 40% 45%,#000 45%,rgba(0,0,0,.85) 62%,rgba(0,0,0,0) 78%);filter:blur(.6px);
  box-shadow:0 0 6px 2px rgba(0,0,0,.6)}
#hint{position:absolute;right:4vw;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;font-size:11px;color:#5c5761;opacity:0;transition:opacity .4s}
#hint.on{opacity:1;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}

#choices{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:16px}
#choices button{font:inherit;font-size:16px;letter-spacing:.3em;color:var(--ink);background:rgba(10,9,11,.88);border:1px solid #3c3741;padding:12px 0;width:min(62%,300px);opacity:0;animation:fin .8s forwards}
#flash{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0}
#flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}

/* タイトル・章扉 */
.card{position:absolute;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1.4s}
.card.hide{opacity:0;pointer-events:none}
#title h1{font-weight:400;font-size:clamp(20px,3.4vw,30px);letter-spacing:.32em;color:#cfc8bc;margin-left:.32em}
#title h2{font-weight:400;font-size:12px;letter-spacing:.5em;color:#6f6973;margin:14px 0 40px .5em}
#title button{display:block;margin:12px auto;font:inherit;font-size:14px;letter-spacing:.4em;color:#a39d94;background:none;border:none;padding:8px 20px}
#title button:disabled{color:#3a363e}
#title .note{position:absolute;bottom:20px;left:0;right:0;font-size:11px;color:#4a4650;letter-spacing:.15em;line-height:2}
#chap h1{font-weight:400;font-size:13px;letter-spacing:.6em;color:#7d776e;margin-left:.6em}
#chap h2{font-weight:400;font-size:clamp(20px,3vw,28px);letter-spacing:.5em;color:#cfc8bc;margin:18px 0 0 .5em}
#chaplist{display:none}
#chaplist.on{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="bg"><img id="imA" alt=""><img id="imB" alt=""><div class="ph" id="ph"></div></div>
  <div id="shade"></div>
  <canvas id="ash"></canvas>
  <div id="win"></div>
  <div id="choices"></div>
  <div id="hint">▼</div>
  <div id="flash"></div>
  <div class="card hide" id="chap"><div><h1 id="chapA"></h1><h2 id="chapB"></h2></div></div>
  <div class="card" id="title"><div>
    <h1>DIRT AND SMOKE</h1><h2>姉 妹 編</h2>
    <button id="bNew">はじめから</button>
    <button id="bCont" disabled>つづきから</button>
    <button id="bChap">章をえらぶ</button>
    <div id="chaplist"></div>
  </div><div class="note">音が出ます。横向き・ヘッドホン推奨。</div></div>
</div>
<script>window.CHAPTER_COUNT=6;</script>
<script src="chapters/ch1.js"></script>
<!-- 章を書いたら、ここに1行ずつ足す -->
<script>
(()=>{
'use strict';
const Q=new URLSearchParams(location.search);
const FAST=Q.has('fast'), AUTO=Q.has('auto'), DEBUG=Q.has('debug');
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,FAST?Math.min(ms,20):ms));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const IMG='../assets/img/';
const CH=window.CHAPTERS||{};

/* ---------- 台本の読み込み ---------- */
function parse(src){
  const prog=[], labels={}; let speakers=[]; let blank=false;
  for(const raw of src.split('\n')){
    const s=raw.replace(/\s+$/,'');
    if(s===''){ if(prog.length&&!blank){prog.push({t:'page'});blank=true;} continue; }
    blank=false;
    if(s[0]==='*'){ labels[s.slice(1)]=prog.length; continue; }
    if(s[0]==='@'){ const [c,...a]=s.slice(1).split(' '); if(c==='speakers'){ speakers=a; continue; } prog.push({t:'cmd',c,a:a.join(' ')}); continue; }
    let name=null, text=s;
    for(const sp of speakers){ if(s.startsWith(sp+'「')){ name=sp; text=s.slice(sp.length); break; } }
    prog.push({t:'line',name,text});
  }
  return {prog,labels};
}
const COLORS={'青':'c-blue','赤':'c-red','白':'c-white','紫':'c-purple'};
function tokens(text){
  const out=[]; const re=/私《(青|赤|白|紫)》|■■/g; let i=0,m;
  while((m=re.exec(text))){ for(const ch of text.slice(i,m.index)) out.push({ch});
    if(m[0]==='■■') out.push({blot:true}); else out.push({ch:'私',cls:COLORS[m[1]]}); i=re.lastIndex; }
  for(const ch of text.slice(i)) out.push({ch}); return out;
}

/* ---------- 文字 ---------- */
const win=$('win'), hint=$('hint');
let typing=null, noname=false;
function clearText(){ win.innerHTML=''; }
function layout(mode){ win.className=mode||''; }
function addTok(body,t){ const s=document.createElement('span'); if(t.blot){ s.className='blot ch'; } else { s.className='ch'+(t.cls?' '+t.cls:''); s.textContent=t.ch; } body.appendChild(s); }
function typeLine(text,name){
  const div=document.createElement('div'); div.className='line';
  if(name&&!noname){ const n=document.createElement('span'); n.className='nm'; n.textContent=name; div.appendChild(n); }
  const body=document.createElement('span'); div.appendChild(body); win.appendChild(div);
  const toks=tokens(text);
  return new Promise(res=>{
    let k=0; const speed=FAST?0:40;
    const finish=()=>{ while(k<toks.length) addTok(body,toks[k++]); clearInterval(iv); typing=null; res(div); };
    typing=finish; const iv=setInterval(()=>{ if(k<toks.length) addTok(body,toks[k++]); else finish(); },speed||1);
    if(!speed) finish();
  });
}
async function rewrite(newText){
  const last=win.lastElementChild; if(!last) return;
  const chars=[...last.querySelectorAll('.ch')];
  for(let i=chars.length-1;i>=0;i--){ chars[i].remove(); await sleep(70); }
  await sleep(400);
  const body=last.querySelector('span:last-child')||last;
  for(const t of tokens(newText)){ addTok(body,t); await sleep(110); }
}

/* ---------- 絵 ---------- */
const imA=$('imA'), imB=$('imB'), ph=$('ph'); let front=imA, cur={name:'none',filt:''};
function setImg(name,filt){
  cur={name,filt:filt||''};
  if(name==='none'){ imA.classList.remove('on'); imB.classList.remove('on'); ph.classList.remove('on'); return; }
  const cls=filt?' f-'+filt:'';
  const back=front===imA?imB:imA;
  const snap=/^mirror/.test(name)&&/^mirror/.test(front.dataset.n||'');
  back.style.transition=snap?'opacity .35s, filter .35s':''; front.style.transition=snap?'opacity .35s, filter .35s':'';
  back.onerror=()=>{ back.classList.remove('on'); ph.textContent=DEBUG?('［絵：'+name+'］'):''; ph.className='ph on'+cls; };
  back.onload=()=>{ ph.classList.remove('on'); };
  back.dataset.n=name; back.src=IMG+name+'.jpg'; back.className='on'+cls; front.classList.remove('on'); front=back;
}
function flash(color){ const f=$('flash'); f.style.background=color==='red'?'#7d1820':'#e8e2d8'; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
async function bulge(){ $('bg').classList.add('bulge'); await sleep(450); $('bg').classList.remove('bulge'); }

/* ---------- 灰 ---------- */
const ash=$('ash'), g=ash.getContext('2d'); let ashOn=true;
const flakes=[...Array(70)].map(()=>({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.00025+Math.random()*.0006,d:Math.random()*6.28,a:.15+Math.random()*.35}));
function sizeAsh(){ ash.width=ash.clientWidth*devicePixelRatio; ash.height=ash.clientHeight*devicePixelRatio; }
(function draw(){ g.clearRect(0,0,ash.width,ash.height);
  if(ashOn) for(const f of flakes){ f.y+=f.v; f.d+=.01; f.x+=Math.sin(f.d)*.0003; if(f.y>1.02){f.y=-.02;f.x=Math.random();}
    g.globalAlpha=f.a; g.fillStyle='#b9b3ab'; g.beginPath(); g.arc(f.x*ash.width,f.y*ash.height,f.r*devicePixelRatio,0,6.283); g.fill(); }
  requestAnimationFrame(draw); })();
addEventListener('resize',sizeAsh); sizeAsh();

/* ---------- 音 ---------- */
let ctx=null, noiseBuf=null; const tracks={}; let curBgm=null;
const TRACK={lullaby:{src:'../assets/audio/dirt_and_smoke_unplugged.mp3',vol:.8,loopEnd:58},
             liar:{src:'../assets/audio/liar_remastered.mp3',vol:.55,loop:true},
             obscure:{src:'../assets/audio/obscure.mp3',vol:.8,loop:true},
             obscure_far:{src:'../assets/audio/obscure.mp3',vol:.22,loop:true,far:true},
             title:{src:'../assets/audio/dirt_and_smoke_unplugged.mp3',vol:.55,loopEnd:40},
             theme:{src:'../assets/audio/dirt_and_smoke_guitar_ballad.mp3',vol:.9}};
function initAudio(){
  if(ctx) return; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; return; }
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function track(name){
  const def=TRACK[name]; const key=def.src+(def.far?'#far':'');
  let t=tracks[key];
  if(!t){ const a=new Audio(def.src); a.preload='auto'; a.loop=!!def.loop; a.crossOrigin='anonymous';
    t={a,key};
    if(ctx){ const s=ctx.createMediaElementSource(a); const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=def.far?420:20000;
      const gn=ctx.createGain(); gn.gain.value=0; s.connect(f).connect(gn).connect(ctx.destination); t.gain=gn; }
    else a.volume=0;
    if(def.loopEnd) a.addEventListener('timeupdate',()=>{ if(a.currentTime>def.loopEnd){ a.currentTime=0.5; } });
    tracks[key]=t; }
  t.def=def; return t;
}
function vol(t,v,sec){
  if(t.gain){ const p=t.gain.gain; p.cancelScheduledValues(ctx.currentTime); p.setValueAtTime(p.value,ctx.currentTime); p.linearRampToValueAtTime(v,ctx.currentTime+sec); }
  else t.a.volume=v;
}
function bgm(cmd){
  if(cmd==='stop'||cmd==='fade'||cmd==='cut'){
    stopClock();
    if(!curBgm) return; const t=curBgm; curBgm=null; const sec=cmd==='cut'?0.02:cmd==='fade'?3:1.2;
    vol(t,0,sec); setTimeout(()=>{ if(curBgm!==t) t.a.pause(); },sec*1000+80); return;
  }
  stopWind();
  const t=track(cmd); if(curBgm===t) return;
  if(curBgm){ const o=curBgm; vol(o,0,1); setTimeout(()=>{ if(curBgm!==o) o.a.pause(); },1100); }
  curBgm=t; if(!t.a.loop||t.def.loopEnd) t.a.currentTime=0;
  t.a.play().catch(()=>{}); vol(t,t.def.vol,1.5);
  return t;
}
/* 効果音（仮：その場で合成している。本番の音が届いたら差し替える） */
function env(node,t0,a,peak,dec){ const gn=ctx.createGain(); gn.gain.setValueAtTime(0,t0); gn.gain.linearRampToValueAtTime(peak,t0+a); gn.gain.exponentialRampToValueAtTime(.0001,t0+a+dec); node.connect(gn).connect(ctx.destination); return gn; }
function noise(t0,dur,type,freq,q,peak,a,dec){ const s=ctx.createBufferSource(); s.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q||1; s.connect(f); env(f,t0,a,peak,dec); s.start(t0); s.stop(t0+dur); return f; }
function tone(t0,freq,type,peak,a,dec){ const o=ctx.createOscillator(); o.type=type||'sine'; o.frequency.value=freq; env(o,t0,a,peak,dec); o.start(t0); o.stop(t0+a+dec+.05); return o; }
let windNode=null, clockTimer=null;
function stopWind(){ if(windNode){ const w=windNode; windNode=null; w.g.gain.linearRampToValueAtTime(0,ctx.currentTime+1.5); setTimeout(()=>w.s.stop(),1600);} }
function stopClock(){ clearInterval(clockTimer); clockTimer=null; }
const SE={
  cough(t){ noise(t,.3,'bandpass',700,1.2,.5,.01,.17); noise(t+.24,.3,'bandpass',600,1.2,.35,.01,.2); tone(t,95,'sine',.18,.01,.15); noise(t+.6,.3,'bandpass',650,1.4,.2,.01,.16); },
  step(t){ for(let i=0;i<4;i++){ const u=t+i*.62; noise(u,.15,'lowpass',220,1,.55,.005,.09); tone(u,58,'sine',.3,.004,.1); } },
  door(t){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(70,t); o.frequency.linearRampToValueAtTime(120,t+.5); o.frequency.linearRampToValueAtTime(85,t+.9);
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=6; o.connect(f); env(f,t,.08,.12,.9); o.start(t); o.stop(t+1.1);
    noise(t+1,.3,'lowpass',160,1,.6,.005,.25); },
  chair(t){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(55,t); o.frequency.linearRampToValueAtTime(75,t+.4); const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=700; f.Q.value=8; o.connect(f); env(f,t,.05,.1,.45); o.start(t); o.stop(t+.6); },
  clink(t){ [0,.16,.29,.38].forEach((d,i)=>{ const p=.25/(i+1); tone(t+d,2350,'sine',p,.002,.5); tone(t+d,3710,'sine',p*.6,.002,.35); }); },
  cloth(t){ noise(t,.9,'highpass',1400,.7,.22,.18,.55); noise(t+.5,.4,'lowpass',300,1,.25,.01,.25); },
  candle(t){ noise(t,.4,'lowpass',900,1,.35,.02,.25); },
  bell(t){ [220,441,662,883].forEach((f,i)=>tone(t,f,'sine',.16/(i+1),.01,4.5)); },
  thread(t){ const f=noise(t,1.2,'bandpass',2600,14,.35,.25,.8); f.frequency.linearRampToValueAtTime(4600,t+1.1); },
  slam(t){ noise(t,.4,'lowpass',200,1,.9,.002,.3); },
  wind(){ if(windNode) return; const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
    const gn=ctx.createGain(); gn.gain.value=0; s.connect(f).connect(gn).connect(ctx.destination); s.start(); gn.gain.linearRampToValueAtTime(.16,ctx.currentTime+3);
    const l=ctx.createOscillator(); l.frequency.value=.13; const lg=ctx.createGain(); lg.gain.value=160; l.connect(lg).connect(f.frequency); l.start(); windNode={s,g:gn}; },
  clock(){ stopClock(); let n=0; clockTimer=setInterval(()=>{ if(!ctx||++n>40){stopClock();return;} noise(ctx.currentTime,.05,'highpass',3000,1,.12,.001,.03); },1000); },
};
function se(name){ if(!ctx||!SE[name]) return; if(name==='wind'||name==='clock') return SE[name](); SE[name](ctx.currentTime+.02); }



/* ---------- 進行 ---------- */
let chNo=1, P=null, pc=0, locked=false, waitTap=null, curBgmName=null;
const SAVE='ds60_save', CLEAR='ds60_cleared', OPEN='ds60_opened';
function tapPromise(){ if(AUTO) return sleep(1); hint.classList.add('on'); return new Promise(r=>waitTap=()=>{ hint.classList.remove('on'); waitTap=null; r(); }); }
$('app').addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||e.target.closest('.card:not(.hide)')) return;
  if(typing){ typing(); return; }
  if(locked) return;
  if(waitTap) waitTap();
});
function save(){ store.set(SAVE,{ch:chNo,pc,img:cur,bgm:curBgmName,noname}); }
function openedMax(){ return store.get(OPEN)||1; }

async function runChapter(n,startPc=0,state=null){
  chNo=n; const C=CH[n]; if(!C){ await toBeContinued(); return; }
  P=parse(C.script); pc=startPc; noname=state?!!state.noname:false;
  store.set(OPEN,Math.max(openedMax(),n));
  if(state){ if(state.img) setImg(state.img.name,state.img.filt); if(state.bgm) { curBgmName=state.bgm; bgm(state.bgm); } }
  layout('');
  while(pc<P.prog.length){
    const op=P.prog[pc++]; window.__pc=pc; window.__ch=n;
    if(op.t==='page'){ clearText(); save(); continue; }
    if(op.t==='line'){ await typeLine(op.text,op.name); await tapPromise(); continue; }
    const a=op.a;
    switch(op.c){
      case 'img': { const [nm,f]=a.split(' '); setImg(nm,f); break; }
      case 'bgm': curBgmName=['stop','fade','cut'].includes(a)?null:a; bgm(a); break;
      case 'se': se(a); break;
      case 'wait': locked=true; hint.classList.remove('on'); await sleep(+a); locked=false; break;
      case 'flash': flash(a); break;
      case 'bulge': await bulge(); break;
      case 'ash': ashOn=a!=='off'; break;
      case 'center': layout('center'); break;
      case 'low': layout(''); break;
      case 'rewrite': locked=true; await sleep(300); await rewrite(a); locked=false; await tapPromise(); break;
      case 'goto': pc=P.labels[a]; break;
      case 'noname': noname=true; break;
      case 'choice': pc=P.labels[await choose(a)]; clearText(); break;
      case 'opening': await opening(); break;
      case 'chaptertitle': await chapterTitle(C); break;
      case 'chapterend': await chapterEnd(C); return runChapter(n+1);
    }
  }
}
function choose(spec){
  return new Promise(res=>{
    const box=$('choices'); box.innerHTML=''; locked=true; hint.classList.remove('on');
    const opts=spec.split('|').map(o=>o.split('>'));
    if(AUTO){ locked=false; return res(opts[0][1]); }
    for(const [label,to] of opts){ const b=document.createElement('button'); b.textContent=label;
      b.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); box.innerHTML=''; locked=false; res(to); }); box.appendChild(b); }
  });
}
async function opening(){
  setImg('none'); layout('center'); clearText();
  se('bell'); await sleep(1800);
  const again=!!store.get(CLEAR);
  await typeLine(again?'灰と煙の中で、私《白》は、また目を覚ました。':'灰と煙の中で、私《白》は目を覚ました。');
  await tapPromise(); clearText(); layout('');
}
async function chapterTitle(C){
  const c=$('chap'); $('chapA').textContent=C.title; $('chapB').textContent=C.sub; c.classList.remove('hide');
  locked=true; await sleep(3200); c.classList.add('hide'); await sleep(1400); locked=false;
}
async function chapterEnd(C){
  locked=true; clearText(); bgm('fade'); if(ctx) stopWind(); setImg('none'); await sleep(1500);
  const c=$('chap'); $('chapA').textContent=C.title; $('chapB').textContent=C.sub+'　了'; c.classList.remove('hide');
  await sleep(3000); c.classList.add('hide'); await sleep(1400); locked=false;
  store.set(SAVE,{ch:chNo+1,pc:0,img:{name:'none',filt:''},bgm:null,noname:false});
}
async function toBeContinued(){
  layout('center'); clearText(); await typeLine('（つづく）'); document.title='END';
  if(!AUTO){ await tapPromise(); location.reload(); }
}

/* ---------- タイトル ---------- */
function start(fn){
  initAudio(); if(ctx&&ctx.state==='suspended') ctx.resume();
  for(const k of Object.keys(TRACK)){ const t=track(k); t.a.play().then(()=>{ if(curBgm!==t) t.a.pause(); }).catch(()=>{}); }
  $('title').classList.add('hide');
  try{ document.documentElement.requestFullscreen?.().catch(()=>{}); screen.orientation?.lock?.('landscape').catch(()=>{}); }catch(e){}
  setTimeout(fn,1200);
}
const sv=store.get(SAVE); if(sv&&CH[sv.ch]) $('bCont').disabled=false;
$('bNew').onclick=()=>start(()=>runChapter(1));
$('bCont').onclick=()=>{ const s=store.get(SAVE); start(()=>runChapter(s.ch,s.pc,s)); };
$('bChap').onclick=()=>{ const L=$('chaplist'); L.innerHTML=''; const max=openedMax();
  for(let i=1;i<=window.CHAPTER_COUNT;i++){ if(!CH[i]) continue; const b=document.createElement('button'); b.textContent=CH[i].title+'　'+CH[i].sub; b.disabled=i>max;
    b.onclick=()=>start(()=>runChapter(i)); L.appendChild(b); }
  L.classList.toggle('on'); };
if(Q.has('ch')) setTimeout(()=>start(()=>runChapter(+Q.get('ch'),+(Q.get('at')||0))),100);   // 検証用
else if(AUTO) setTimeout(()=>start(()=>runChapter(1)),100);
})();
</script>
