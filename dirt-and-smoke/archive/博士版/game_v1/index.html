<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>DIRT AND SMOKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#d8d1c5; --dim:#7d776e;
  --blue:#7899b8; --red:#ad5558; --white:#d8d1c5; --purple:#a987b5;
  --bg:#000;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;margin:0 auto;max-width:560px;overflow:hidden;background:#000}

#ash{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;transition:opacity 1.5s}

#art{position:absolute;left:0;right:0;top:0;height:50%;z-index:1;transition:transform .9s ease}
#art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease, filter 1s}
#art img.on{opacity:1}
#art::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,#000 100%),
             radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
.f-night{filter:brightness(.55) saturate(.7)}
.f-dark{filter:brightness(.38) saturate(.6)}
.f-sepia{filter:sepia(.85) blur(1.6px) brightness(.75) contrast(.9)}
.f-smoke{filter:brightness(.5) contrast(1.25) saturate(.4) blur(.6px)}
#tint{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s;
  background:radial-gradient(ellipse at 50% 40%,rgba(140,20,30,.35),rgba(60,0,10,.6));mix-blend-mode:multiply}
#tint.on{opacity:1}
#art.bulge{transform:scale(1.035)}
#moon{position:absolute;z-index:2;top:12%;right:14%;width:16vw;max-width:80px;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#9a2a30,#5e1218);box-shadow:0 0 40px rgba(150,30,40,.55);
  opacity:0;transition:opacity 3s}
#moon.on{opacity:.9}

#text{position:absolute;left:0;right:0;top:50%;bottom:0;z-index:6;padding:6px 26px 60px;
  font-size:17px;line-height:2.05;letter-spacing:.04em}
#text.center{top:0;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-bottom:0}
#text.mid{top:28%}
.line{opacity:0;animation:fin .5s forwards;min-height:1em;white-space:pre-wrap}
@keyframes fin{to{opacity:1}}
.nm{display:block;font-size:11.5px;letter-spacing:.3em;color:var(--dim);line-height:1.6;margin-top:4px}
.ch{opacity:0;animation:fin .25s forwards}
.c-blue{color:var(--blue)} .c-red{color:var(--red)} .c-white{color:var(--white)}
.c-purple{color:var(--purple);font-size:1.25em}

#choices{position:absolute;left:0;right:0;bottom:12%;z-index:8;display:flex;flex-direction:column;align-items:center;gap:18px}
#choices button{font:inherit;font-size:16px;letter-spacing:.3em;color:var(--ink);background:rgba(10,9,11,.85);
  border:1px solid #3c3741;padding:12px 0;width:62%;max-width:280px;opacity:0;animation:fin .8s forwards}
#choices button:active{background:#1d1a20}

#hint{position:absolute;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:7;font-size:11px;color:#5c5761;opacity:0;transition:opacity .4s}
#hint.on{opacity:1;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

#flash{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0}
#flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}

#boot,#titleCard{position:absolute;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1.6s}
#boot p{font-size:13px;color:#8b858e;line-height:2.3;letter-spacing:.12em}
#boot .tap{margin-top:34px;font-size:12px;color:#5c5761;animation:blink 2s infinite}
#titleCard{opacity:0;pointer-events:none}
#titleCard.on{opacity:1;pointer-events:auto}
#titleCard h1{font-weight:400;font-size:23px;letter-spacing:.3em;color:#cfc8bc;margin-left:.32em}
#titleCard h2{font-weight:400;font-size:12px;letter-spacing:.5em;color:#6f6973;margin:16px 0 0 .5em}
#titleCard .tap{margin-top:60px;font-size:12px;letter-spacing:.3em;color:#5c5761;animation:blink 2s infinite}
#titleCard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;filter:brightness(.6) saturate(.5)}
#titleCard > div{position:relative}
.hidden{opacity:0!important;pointer-events:none!important}

#lyric{position:absolute;left:0;right:0;top:62%;z-index:7;text-align:center;font-size:19px;line-height:2.4;letter-spacing:.2em;opacity:0;transition:opacity 2.5s}
#lyric.on{opacity:1}
#credits{position:absolute;left:0;right:0;top:60%;z-index:7;text-align:center;font-size:12px;line-height:2.6;letter-spacing:.25em;color:#9a948c;opacity:0;transition:opacity 3s}
#credits.on{opacity:1}
#credits b{display:block;font-weight:400;font-size:17px;letter-spacing:.3em;color:#cfc8bc;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">
  <div id="art"><img id="imA" alt=""><img id="imB" alt=""><div id="tint"></div><div id="moon"></div></div>
  <canvas id="ash"></canvas>
  <div id="text"></div>
  <div id="choices"></div>
  <div id="hint">▼</div>
  <div id="lyric"></div>
  <div id="credits"></div>
  <div id="flash"></div>
  <div id="titleCard"><img src="../../../assets/img/hall.jpg" alt=""><div>
    <h1>DIRT AND SMOKE</h1><h2>フランケン少女計画</h2><div class="tap">タップして はじめる</div></div></div>
  <div id="boot"><div>
    <p>音が出ます。<br>ヘッドホンを推奨します。<br>部屋を暗くして、どうぞ。</p>
    <div class="tap">画面をタップ</div></div></div>
</div>
<script src="script.js"></script>
<script>
(()=>{
'use strict';
const Q=new URLSearchParams(location.search);
const FAST=Q.has('fast');            // 検証用：文字送りと待ち時間を短くする
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,FAST?Math.min(ms,30):ms));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- 台本の読み込み ---------- */
const prog=[]; const labels={};
{
  let blank=false;
  for(const raw of window.SCRIPT.split('\n')){
    const s=raw.replace(/\s+$/,'');
    if(s===''){ if(prog.length && !blank){prog.push({t:'page'}); blank=true;} continue; }
    blank=false;
    if(s[0]==='*'){ labels[s.slice(1)]=prog.length; continue; }
    if(s[0]==='@'){ const [c,...a]=s.slice(1).split(' '); prog.push({t:'cmd',c,a:a.join(' ')}); continue; }
    const m=s.match(/^(博士)(「.*)$/);
    prog.push(m?{t:'line',name:m[1],text:m[2]}:{t:'line',text:s});
  }
}
const COLORS={'青':'c-blue','赤':'c-red','白':'c-white','紫':'c-purple'};
function tokens(text){ // 文字ごとに分け、私《色》に色をつける
  const out=[]; const re=/私《(青|赤|白|紫)》/g; let i=0,m;
  while((m=re.exec(text))){ for(const ch of text.slice(i,m.index)) out.push({ch}); out.push({ch:'私',cls:COLORS[m[1]]}); i=re.lastIndex; }
  for(const ch of text.slice(i)) out.push({ch}); return out;
}

/* ---------- 画面 ---------- */
const textEl=$('text'), hint=$('hint');
let typing=null, noname=false;
function clearText(){ textEl.innerHTML=''; }
function setLayout(mode){ textEl.className=mode||''; }
function typeLine(text,name,el){
  const div=el||document.createElement('div'); div.className='line';
  if(!el){ if(name&&!noname){const n=document.createElement('span');n.className='nm';n.textContent=name;div.appendChild(n);} textEl.appendChild(div); }
  const body=document.createElement('span'); div.appendChild(body);
  const toks=tokens(text);
  return new Promise(res=>{
    let k=0; const speed=FAST?0:42;
    const finish=()=>{ while(k<toks.length) add(); clearInterval(iv); typing=null; res(div); };
    function add(){ const t=toks[k++]; const s=document.createElement('span'); s.className='ch'+(t.cls?' '+t.cls:''); s.textContent=t.ch; body.appendChild(s); }
    typing=finish;
    const iv=setInterval(()=>{ if(k<toks.length) add(); else finish(); },speed||1);
    if(!speed) finish();
  });
}
async function rewrite(newText){
  const last=textEl.lastElementChild; if(!last) return;
  const chars=[...last.querySelectorAll('.ch')];
  for(let i=chars.length-1;i>=0;i--){ chars[i].remove(); await sleep(70); }
  await sleep(400);
  last.querySelector('span:last-child')?.remove();
  await typeLineSlow(newText,last);
}
async function typeLineSlow(text,el){ // 書き換え用：ゆっくり
  const body=document.createElement('span'); el.appendChild(body);
  for(const t of tokens(text)){ const s=document.createElement('span'); s.className='ch'+(t.cls?' '+t.cls:''); s.textContent=t.ch; body.appendChild(s); await sleep(110); }
}

/* 絵 */
const imA=$('imA'), imB=$('imB'); let front=imA, curImg='none';
const MIRROR=/^mirror/;
function setImg(name,filt){
  const cls=filt?('f-'+filt):'';
  $('tint').classList.toggle('on',filt==='smoke'||filt==='red');
  if(name==='none'){ imA.classList.remove('on'); imB.classList.remove('on'); curImg='none'; $('moon').classList.remove('on'); setLayout('mid'); return; }
  setLayout('');
  if(name===curImg){ front.className='on '+cls; return; }
  const back=front===imA?imB:imA;
  const fast=MIRROR.test(name)&&MIRROR.test(curImg);
  back.style.transition=fast?'opacity .35s, filter .35s':''; front.style.transition=fast?'opacity .35s, filter .35s':'';
  back.src='../../../assets/img/'+name+'.jpg'; back.className='on '+cls; front.classList.remove('on');
  front=back; curImg=name;
}
function flash(color){ const f=$('flash'); f.style.background=color==='red'?'#7d1820':'#e8e2d8'; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
async function bulge(){ $('art').classList.add('bulge'); await sleep(450); $('art').classList.remove('bulge'); }

/* 灰 */
const ash=$('ash'), g=ash.getContext('2d'); let flakes=[], ashOn=true;
function sizeAsh(){ ash.width=ash.clientWidth*devicePixelRatio; ash.height=ash.clientHeight*devicePixelRatio; }
function seedAsh(){ flakes=[]; for(let i=0;i<70;i++) flakes.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.00025+Math.random()*.0006,d:Math.random()*6.28,a:.15+Math.random()*.35}); }
function drawAsh(){
  g.clearRect(0,0,ash.width,ash.height);
  if(ashOn){ for(const f of flakes){ f.y+=f.v; f.d+=.01; f.x+=Math.sin(f.d)*.0003; if(f.y>1.02){f.y=-.02;f.x=Math.random();}
    g.globalAlpha=f.a; g.fillStyle='#b9b3ab'; g.beginPath(); g.arc(f.x*ash.width,f.y*ash.height,f.r*devicePixelRatio,0,6.283); g.fill(); } }
  requestAnimationFrame(drawAsh);
}
addEventListener('resize',sizeAsh); sizeAsh(); seedAsh(); drawAsh();
function setAsh(on){ ashOn=on; ash.style.opacity=on?1:0; }

/* ---------- 音 ---------- */
let ctx=null, noiseBuf=null; const tracks={}; let curBgm=null;
const TRACK={lullaby:{src:'../../../assets/audio/dirt_and_smoke_unplugged.mp3',vol:.8,loopEnd:58},
             liar:{src:'../../../assets/audio/liar_remastered.mp3',vol:.55,loop:true},
             obscure:{src:'../../../assets/audio/obscure.mp3',vol:.8,loop:true},
             obscure_far:{src:'../../../assets/audio/obscure.mp3',vol:.22,loop:true,far:true},
             title:{src:'../../../assets/audio/dirt_and_smoke_unplugged.mp3',vol:.55,loopEnd:40},
             theme:{src:'../../../assets/audio/dirt_and_smoke_guitar_ballad.mp3',vol:.9}};
function initAudio(){
  if(ctx) return; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; return; }
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function track(name){
  const def=TRACK[name]; const key=def.src+(def.far?'#far':'');
  let t=tracks[key];
  if(!t){ const a=new Audio(def.src); a.preload='auto'; a.loop=!!def.loop; a.crossOrigin='anonymous';
    t={a,key};
    if(ctx){ const s=ctx.createMediaElementSource(a); const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=def.far?420:20000;
      const gn=ctx.createGain(); gn.gain.value=0; s.connect(f).connect(gn).connect(ctx.destination); t.gain=gn; }
    else a.volume=0;
    if(def.loopEnd) a.addEventListener('timeupdate',()=>{ if(a.currentTime>def.loopEnd){ a.currentTime=0.5; } });
    tracks[key]=t; }
  t.def=def; return t;
}
function vol(t,v,sec){
  if(t.gain){ const p=t.gain.gain; p.cancelScheduledValues(ctx.currentTime); p.setValueAtTime(p.value,ctx.currentTime); p.linearRampToValueAtTime(v,ctx.currentTime+sec); }
  else t.a.volume=v;
}
function bgm(cmd){
  if(cmd==='stop'||cmd==='fade'||cmd==='cut'){
    stopClock();
    if(!curBgm) return; const t=curBgm; curBgm=null; const sec=cmd==='cut'?0.02:cmd==='fade'?3:1.2;
    vol(t,0,sec); setTimeout(()=>{ if(curBgm!==t) t.a.pause(); },sec*1000+80); return;
  }
  stopWind();
  const t=track(cmd); if(curBgm===t) return;
  if(curBgm){ const o=curBgm; vol(o,0,1); setTimeout(()=>{ if(curBgm!==o) o.a.pause(); },1100); }
  curBgm=t; if(!t.a.loop||t.def.loopEnd) t.a.currentTime=0;
  t.a.play().catch(()=>{}); vol(t,t.def.vol,1.5);
  return t;
}
/* 効果音（仮：その場で合成している。本番の音が届いたら差し替える） */
function env(node,t0,a,peak,dec){ const gn=ctx.createGain(); gn.gain.setValueAtTime(0,t0); gn.gain.linearRampToValueAtTime(peak,t0+a); gn.gain.exponentialRampToValueAtTime(.0001,t0+a+dec); node.connect(gn).connect(ctx.destination); return gn; }
function noise(t0,dur,type,freq,q,peak,a,dec){ const s=ctx.createBufferSource(); s.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q||1; s.connect(f); env(f,t0,a,peak,dec); s.start(t0); s.stop(t0+dur); return f; }
function tone(t0,freq,type,peak,a,dec){ const o=ctx.createOscillator(); o.type=type||'sine'; o.frequency.value=freq; env(o,t0,a,peak,dec); o.start(t0); o.stop(t0+a+dec+.05); return o; }
let windNode=null, clockTimer=null;
function stopWind(){ if(windNode){ const w=windNode; windNode=null; w.g.gain.linearRampToValueAtTime(0,ctx.currentTime+1.5); setTimeout(()=>w.s.stop(),1600);} }
function stopClock(){ clearInterval(clockTimer); clockTimer=null; }
const SE={
  cough(t){ noise(t,.3,'bandpass',700,1.2,.5,.01,.17); noise(t+.24,.3,'bandpass',600,1.2,.35,.01,.2); tone(t,95,'sine',.18,.01,.15); noise(t+.6,.3,'bandpass',650,1.4,.2,.01,.16); },
  step(t){ for(let i=0;i<4;i++){ const u=t+i*.62; noise(u,.15,'lowpass',220,1,.55,.005,.09); tone(u,58,'sine',.3,.004,.1); } },
  door(t){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(70,t); o.frequency.linearRampToValueAtTime(120,t+.5); o.frequency.linearRampToValueAtTime(85,t+.9);
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=6; o.connect(f); env(f,t,.08,.12,.9); o.start(t); o.stop(t+1.1);
    noise(t+1,.3,'lowpass',160,1,.6,.005,.25); },
  chair(t){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(55,t); o.frequency.linearRampToValueAtTime(75,t+.4); const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=700; f.Q.value=8; o.connect(f); env(f,t,.05,.1,.45); o.start(t); o.stop(t+.6); },
  clink(t){ [0,.16,.29,.38].forEach((d,i)=>{ const p=.25/(i+1); tone(t+d,2350,'sine',p,.002,.5); tone(t+d,3710,'sine',p*.6,.002,.35); }); },
  cloth(t){ noise(t,.9,'highpass',1400,.7,.22,.18,.55); noise(t+.5,.4,'lowpass',300,1,.25,.01,.25); },
  candle(t){ noise(t,.4,'lowpass',900,1,.35,.02,.25); },
  bell(t){ [220,441,662,883].forEach((f,i)=>tone(t,f,'sine',.16/(i+1),.01,4.5)); },
  thread(t){ const f=noise(t,1.2,'bandpass',2600,14,.35,.25,.8); f.frequency.linearRampToValueAtTime(4600,t+1.1); },
  slam(t){ noise(t,.4,'lowpass',200,1,.9,.002,.3); },
  wind(){ if(windNode) return; const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
    const gn=ctx.createGain(); gn.gain.value=0; s.connect(f).connect(gn).connect(ctx.destination); s.start(); gn.gain.linearRampToValueAtTime(.16,ctx.currentTime+3);
    const l=ctx.createOscillator(); l.frequency.value=.13; const lg=ctx.createGain(); lg.gain.value=160; l.connect(lg).connect(f.frequency); l.start(); windNode={s,g:gn}; },
  clock(){ stopClock(); let n=0; clockTimer=setInterval(()=>{ if(!ctx||++n>40){stopClock();return;} noise(ctx.currentTime,.05,'highpass',3000,1,.12,.001,.03); },1000); },
};
function se(name){ if(!ctx||!SE[name]) return; if(name==='wind'||name==='clock') return SE[name](); SE[name](ctx.currentTime+.02); }

/* ---------- 進行 ---------- */
let pc=0, locked=false, waitTap=null;
window.__labels=labels; window.__prog=prog;
function tapPromise(){ hint.classList.add('on'); return new Promise(r=>waitTap=()=>{ hint.classList.remove('on'); waitTap=null; r(); }); }
function onTap(e){
  if(e&&e.target&&e.target.tagName==='BUTTON') return;
  if(typing){ typing(); return; }
  if(locked) return;
  if(waitTap) waitTap();
}
$('app').addEventListener('pointerdown',onTap);

async function run(){
  while(pc<prog.length){
    const op=prog[pc++]; window.__pc=pc;
    if(op.t==='page'){ clearText(); continue; }
    if(op.t==='line'){ await typeLine(op.text,op.name); if(FAST&&Q.has('auto')){await sleep(1);continue;} await tapPromise(); continue; }
    const a=op.a;
    switch(op.c){
      case 'img': { const [n,f]=a.split(' '); setImg(n,f); break; }
      case 'bgm': bgm(a); break;
      case 'se': se(a); break;
      case 'wait': locked=true; hint.classList.remove('on'); await sleep(+a); locked=false; break;
      case 'flash': flash(a); break;
      case 'bulge': await bulge(); break;
      case 'moon': $('moon').classList.add('on'); break;
      case 'rewrite': locked=true; await sleep(300); await rewrite(a); locked=false; await auto(); break;
      case 'goto': pc=labels[a]; break;
      case 'noname': noname=true; break;
      case 'choice': pc=labels[await choose(a)]; clearText(); break;
      case 'opening': await opening(); break;
      case 'title': await titleCard(); break;
      case 'ending': await ending(); return;
    }
  }
}
function choose(spec){
  return new Promise(res=>{
    const box=$('choices'); box.innerHTML=''; locked=true;
    if(FAST&&Q.has('auto')){ const first=spec.split('|')[0].split('>')[1]; locked=false; return res(first); }
    for(const opt of spec.split('|')){ const [label,to]=opt.split('>'); const b=document.createElement('button'); b.textContent=label;
      b.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); box.innerHTML=''; locked=false; res(to); }); box.appendChild(b); }
  });
}
async function opening(){
  setImg('none'); setLayout('center'); setAsh(true);
  se('bell'); await sleep(1800);
  const again=store.get('ds_cleared')==='1';
  await typeLine(again?'灰と煙の中で、私《白》は、また目を覚ました。':'灰と煙の中で、私《白》は目を覚ました。');
  await auto(); clearText();
}
async function auto(){ if(FAST&&Q.has('auto')) return; await tapPromise(); }
async function titleCard(){
  const tc=$('titleCard'); bgm('title'); tc.classList.add('on');
  await sleep(1200); await auto(); bgm('fade'); tc.classList.remove('on'); await sleep(1800); setLayout('');
}
/* エンディング：主題歌に合わせて絵を替える（秒数は推定。総監督の確認待ち） */
const TIMELINE=[[0,'none'],[8,'city'],[38,'hall'],[68,'chair'],[96,'bedside'],[124,'record'],[150,'flowers'],[176,'mirror_back'],[196,'stitch'],[214,'mirror1a'],[244,'ending'],[262,'none']];
const LYRIC_AT=226, CREDIT_AT=246;
async function ending(){
  locked=true; bgm('stop'); clearText(); setImg('none'); setAsh(false); $('moon').classList.remove('on');
  await sleep(5000);                                   // 黒い画面に、プレイヤーの顔が映る時間
  setLayout('center'); locked=false;
  await typeLine('あなたは、誰？'); await auto(); clearText(); locked=true; await sleep(3000); locked=false;
  await typeLine('灰と煙の中で、私《白》は目を覚ました。'); await auto();
  await typeLine('それが、二度目だったのかどうかは知らない。'); await auto();
  clearText(); locked=true; setAsh(true);
  const t=bgm('theme'); const a=t.a;
  let idx=-1, lyricShown=false, creditShown=false;
  const tick=()=>{
    const now=FAST?(performance.now()-start)/1000*40:a.currentTime;
    while(idx+1<TIMELINE.length && now>=TIMELINE[idx+1][0]){ idx++; const n=TIMELINE[idx][1]; setImg(n, n==='flowers'?'red':''); if(n==='flowers') $('moon').classList.add('on'); if(n==='stitch') $('moon').classList.remove('on'); }
    if(!lyricShown&&now>=LYRIC_AT){ lyricShown=true; const L=$('lyric'); L.innerHTML='心の闇が<br>本当の<span class="c-purple">私</span>'; L.classList.add('on'); setTimeout(()=>L.classList.remove('on'),FAST?50:9000); }
    if(!creditShown&&now>=CREDIT_AT){ creditShown=true; const C=$('credits'); C.innerHTML='<b>DIRT AND SMOKE</b>総監督・音楽　shouyama<br>ビジュアル　ChatGPT<br>シナリオ　Claude'; C.classList.add('on'); setTimeout(()=>C.classList.remove('on'),FAST?50:14000); }
  };
  const start=performance.now();
  await new Promise(res=>{
    const iv=setInterval(()=>{ tick(); const done=FAST?(performance.now()-start)/1000*40>270:(a.ended||(a.duration&&a.currentTime>=a.duration-.05)); if(done){clearInterval(iv);res();} },200);
  });
  setImg('none'); setAsh(false); clearText(); setLayout('center');
  store.set('ds_cleared','1');
  await sleep(3000);
  await typeLine('おやすみ。');
  locked=false; await auto();
  if(!(FAST&&Q.has('auto'))) location.reload(); else document.title='END';
}

/* ---------- 起動 ---------- */
$('boot').addEventListener('pointerdown',ev=>{
  ev.stopPropagation(); initAudio(); if(ctx&&ctx.state==='suspended') ctx.resume();
  // iOS で後から鳴らせるよう、最初のタップで全曲を一度だけ準備しておく
  for(const k of Object.keys(TRACK)){ const t=track(k); t.a.play().then(()=>{ if(curBgm!==t) t.a.pause(); }).catch(()=>{}); }
  const b=$('boot'); b.classList.add('hidden'); setTimeout(()=>b.remove(),1700);
  if(Q.has('at')){ pc=+Q.get('at'); }   // 検証用：台本の途中から始める
  setTimeout(()=>run(),900);
},{once:true});
if(Q.has('auto')) setTimeout(()=>$('boot').dispatchEvent(new Event('pointerdown')),100);
})();
</script>
