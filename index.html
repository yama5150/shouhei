                    dishes: [
                        { name: 'サーモン', unit: '柵', defaultQuantity: 5, cost: 1100 },
                        { name: 'サーモンたたき', unit: '柵', defaultQuantity: 5, cost: 950 },
                        { name: 'まぐろ', unit: '柵', defaultQuantity: 5, cost: 1300 },
                        { name: 'まぐろたたき', unit: '柵', defaultQuantity: 5, cost: 980 },
                        { name: 'ホタテ', unit: 'g', defaultQuantity: 500, cost: 6 },

                    dishes: [

                        { name: '函館塩ラーメン', unit: '杯', defaultQuantity: 10, cost: 380 },
                        { name: '釧路醤油ラーメン', unit: '杯', defaultQuantity: 10, cost: 380 }

                }
            }
        };

        const state = {
            isFirebaseMode: false, currentMenu: null, userId: 'local-user', userName: 'ゲスト',
            appId: typeof __app_id !== 'undefined' ? __app_id : 'default', db: null, auth: null,
            activeCategory: 'all', searchQuery: '', isProcessing: false, isAdmin: false, pinBuffer: '',
            targetTab: null, viewDate: new Date(), summaryLogs: [], recentLogs: [], dailySales: 0,
            currentPage: 1, editTarget: null
        };

        // --- 共通ユーティリティ ---
        const getDateStr = (d) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };
        const showMessage = (text, color = 'bg-primary') => {
            const el = document.getElementById('message-box');
            if (!el) return;
            el.textContent = text;
            el.className = `fixed top-24 left-1/2 -translate-x-1/2 z-[200] text-white font-black px-6 py-3 rounded-2xl shadow-2xl ${color} animate-fade-in`;
            clearTimeout(el._t);
            el._t = setTimeout(() => { el.className = 'hidden'; }, 1500);
        };

        // --- 強制修復 & 表示 ---
        const ensureMenuState = (data) => {
            if (!data || !data.pages || data.version !== MASTER_CONFIG.version) {
                console.log("State Fixed: Forcing v16.9 Master Config.");
                return JSON.parse(JSON.stringify(MASTER_CONFIG));
            }
            return data;
        };

        const initApp = async () => {
            const savedName = localStorage.getItem('staff_name'); if(savedName) state.userName = savedName; updateUserNameUI();

            const localRaw = localStorage.getItem('tracker_menu_v16_9');
            state.currentMenu = ensureMenuState(localRaw ? JSON.parse(localRaw) : null);
            renderUI();

            const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (config) {
                try {
                    const app = initializeApp(config); state.auth = getAuth(app); state.db = getFirestore(app);
                    const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    if (token) await signInWithCustomToken(state.auth, token); else await signInAnonymously(state.auth);

                    onAuthStateChanged(state.auth, async (user) => {
                        if (user) {
                            state.userId = user.uid; state.isFirebaseMode = true; updateStatus('ONLINE', 'bg-green-500');
                            const snap = await getDoc(doc(state.db, `artifacts/${state.appId}/public/data/menu_config_v16_9`, 'config'));
                            if(snap.exists()){
                                state.currentMenu = ensureMenuState(snap.data().config);
                                renderUI(); setupListeners();
                            } else {
                                await setDoc(doc(state.db, `artifacts/${state.appId}/public/data/menu_config_v16_9`, 'config'), { config: state.currentMenu });
                                setupListeners();
                            }
                        }
                    });
                } catch (e) { fallbackToLocal(); }
            } else { fallbackToLocal(); }
        };

        const fallbackToLocal = () => {
            state.isFirebaseMode = false; updateStatus('LOCAL', 'bg-gray-500');
            loadLocalLogs();
        };

        const updateStatus = (text, color) => { const el = document.getElementById('status-badge'); if(el) { el.textContent = `${text} (${MASTER_CONFIG.version})`; el.className = `text-[8px] text-white px-2 py-0.5 rounded-full font-bold ${color}`; } };
        const updateUserNameUI = () => { const el = document.getElementById('current-staff-name'); if(el) el.textContent = state.userName; };

        // --- 描画エンジン (しょうちゃんロジック搭載) ---
        window.renderDishButtons = () => {
            const el = document.getElementById('refill-buttons-container');
            if (!el || !state.currentMenu) return;
            el.innerHTML = '';

            let targetCats = state.searchQuery
                ? Object.keys(state.currentMenu.categories)
                : (state.currentMenu.pages?.[state.currentPage - 1]?.cats || []);

            // 表示順のソート
            if (state.searchQuery) {
                const pageOrder = state.currentMenu.pages.flatMap(p => p.cats);
                targetCats = targetCats.sort((a, b) => {
                    const ia = pageOrder.indexOf(a);
                    const ib = pageOrder.indexOf(b);
                    return (ia === -1 ? Infinity : ia) - (ib === -1 ? Infinity : ib);
                });
            }

            targetCats.forEach(catKey => {
                if (!state.searchQuery && state.activeCategory !== 'all' && state.activeCategory !== catKey) return;

                const cat = state.currentMenu.categories[catKey];
                if (!cat) return;

                const filteredDishes = state.searchQuery
                    ? cat.dishes.filter(d => d.name.toLowerCase().includes(state.searchQuery.toLowerCase()))
                    : cat.dishes;

                if (filteredDishes.length === 0) return;

                const section = document.createElement('div');
                section.className = 'mb-10 animate-fade-in';
                section.innerHTML = `
                    <h3 class="text-[11px] font-black text-gray-500 mb-4 ml-2 flex items-center gap-2 uppercase tracking-[0.2em] border-b pb-2 border-gray-200">
                        <span class="text-lg drop-shadow-sm">${cat.icon || '🍴'}</span>
                        ${cat.label}
                    </h3>
                    <div class="grid grid-cols-2 gap-3 md:grid-cols-3"></div>
                `;

                const grid = section.querySelector('div');
                filteredDishes.forEach(dish => {
                    const btn = document.createElement('button');
                    btn.className = `w-full p-4 text-white font-bold rounded-[20px] shadow-sm active:scale-95 transition ${cat.color} flex flex-col items-center justify-center min-h-[110px] border-b-4 border-black/15`;
                    btn.innerHTML = `
                        <span class="text-[15px] leading-tight text-center font-black drop-shadow-md px-1">${dish.name}</span>
                        <span class="text-[10px] opacity-90 mt-2 font-bold tracking-widest">${dish.defaultQuantity}${dish.unit}</span>
                    `;
                    btn.onclick = () => window.openModal(dish.name, dish.defaultQuantity, dish.unit);
                    grid.appendChild(btn);
                });
                el.appendChild(section);
            });

            if (el.children.length === 0) el.innerHTML = '<div class="text-center py-20 text-gray-400 font-bold text-sm">該当メニューなし</div>';
        };

        window.renderCategories = () => {
            const el = document.getElementById('category-tabs');
            if(!el || !state.currentMenu) return;
            const pageCats = state.currentMenu.pages?.[state.currentPage-1]?.cats || [];
            el.innerHTML = `<button onclick="setCategory('all')" class="whitespace-nowrap px-4 py-2 rounded-full font-black text-[10px] transition ${state.activeCategory==='all'?'bg-gray-800 text-white shadow-lg':'bg-white text-gray-500 border'}">ALL</button>`;
            pageCats.forEach(k => {
                const cat = state.currentMenu.categories[k];
                if(!cat) return;
                el.innerHTML += `<button onclick="setCategory('${k}')" class="whitespace-nowrap px-4 py-2 rounded-full font-black text-[10px] transition flex items-center gap-1 ${state.activeCategory===k?`bg-white ring-2 ring-primary text-gray-900 shadow-md`:'bg-white text-gray-500 border'}"><span>${cat.icon}</span>${cat.label}</button>`;
            });
        };

        window.renderPageNav = () => {
            const el = document.getElementById('page-nav-indicator');
            if(!el || !state.currentMenu) return;
            el.innerHTML = '';
            state.currentMenu.pages.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `w-10 h-10 rounded-2xl text-sm font-black transition ${state.currentPage === p.id ? 'active-page shadow-xl' : 'bg-gray-100 text-gray-400'}`;
                btn.textContent = p.id;
                btn.onclick = () => window.changePage(p.id);
                el.appendChild(btn);
            });
            document.getElementById('page-title').textContent = state.currentMenu.pages[state.currentPage-1]?.label || "";
        };

        // --- 記録処理 ---
        window.recordLog = async (name, qty, unit, type) => {
            if (state.isProcessing) return;
            const q = parseFloat(qty); if(isNaN(q) || q <= 0) return alert("数量を入力");
            state.isProcessing = true; document.getElementById('quantity-modal').classList.add('hidden');
            const logData = { dish: name, quantity: q, unit: unit, type: type, timestamp: new Date(), date: getDateStr(new Date()), staffName: state.userName };
            try {
                if (state.isFirebaseMode) await addDoc(collection(state.db, `artifacts/${state.appId}/public/data/logs_v16_9`), { ...logData, timestamp: serverTimestamp() });
                else { const logs = JSON.parse(localStorage.getItem('daily_logs_v16_9') || '[]'); logs.unshift(logData); if(logs.length > 2000) logs.pop(); localStorage.setItem('daily_logs_v16_9', JSON.stringify(logs)); loadLocalLogs(); }
                showMessage('記録完了', 'bg-primary');
            } catch(e) { showMessage('保存失敗', 'bg-waste'); }
            finally { state.isProcessing = false; }
        };

        // --- モーダル部品 ---
        window.openModal = (name, qty, unit, quickButtons) => {
            document.getElementById('modal-dish-name').textContent = name;
            document.getElementById('modal-unit').textContent = unit;
            const input = document.getElementById('quantity-input'); input.value = qty;
            const qBox = document.getElementById('quick-buttons-area'); qBox.innerHTML = '';
            const btns = quickButtons || [Math.ceil(qty*0.5),qty,qty*2];
            btns.forEach(n => {
                const b = document.createElement('button');
                b.className = 'bg-gray-100 font-bold py-3 rounded-2xl active:bg-blue-100 border text-gray-700 shadow-sm';
                b.textContent = `+${n}`; b.onclick = () => input.value = parseFloat(input.value||0) + n;
                qBox.appendChild(b);
            });
            const aBox = document.getElementById('modal-actions'); aBox.innerHTML = '';
            [{l:'朝在庫',c:'bg-start',t:'start'},{l:'夜在庫',c:'bg-end',t:'end'},{l:'補充',c:'bg-primary',t:'refill'},{l:'廃棄',c:'bg-waste',t:'waste'}].forEach(a=>{
                const b = document.createElement('button');
                b.className = `py-4 text-white font-black rounded-2xl shadow-md active:scale-95 ${a.c} flex flex-col items-center justify-center gap-1`;
                b.innerHTML = `<span class="text-xs uppercase tracking-widest">${a.l}</span>`;
                b.onclick = () => window.recordLog(name, input.value, unit, a.t);
                aBox.appendChild(b);
            });
            document.getElementById('quantity-modal').classList.remove('hidden');
            setTimeout(() => { input.focus(); input.select(); }, 150);
        };

        window.renderUI = () => { renderPageNav(); renderCategories(); renderDishButtons(); };
        window.changePage = (p) => { state.currentPage = p; state.activeCategory = 'all'; renderUI(); const m = document.getElementById('main-content'); if(m) m.scrollTo(0,0); };
        window.movePage = (d) => { let n = state.currentPage + d; if(n<1)n=4; if(n>4)n=1; window.changePage(n); };
        window.setCategory = (cat) => { state.activeCategory = cat; renderDishButtons(); renderCategories(); };
        window.handleSearch = (e) => { state.searchQuery = e.target.value.toLowerCase(); renderUI(); };
        window.changeViewDate = (d) => { state.viewDate.setDate(state.viewDate.getDate()+d); if(state.isFirebaseMode) setupListeners(); else loadLocalLogs(); };
        window.changeStaffName = () => { const n = prompt("あなたの名前", state.userName); if(n){ state.userName=n; localStorage.setItem('staff_name',n); updateUserNameUI(); } };

        const setupListeners = () => {
            const path = `artifacts/${state.appId}/public/data/logs_v16_9`;
            const dStr = getDateStr(state.viewDate);
            onSnapshot(query(collection(state.db, path), where('date', '==', dStr)), (snap) => { state.summaryLogs = snap.docs.map(d => d.data()); updateSummaryView(); });
            onSnapshot(query(collection(state.db, path), orderBy('timestamp', 'desc'), limit(20)), (snap) => { state.recentLogs = snap.docs.map(d => ({...d.data(), timestamp: d.data().timestamp.toDate()})); updateRecentLogView(); });
            loadDailySales();
        };

        const loadLocalLogs = () => {
            const raw = JSON.parse(localStorage.getItem('daily_logs_v16_9') || '[]');
            const dStr = getDateStr(state.viewDate);
            state.summaryLogs = raw.filter(d => d.date === dStr);
            state.recentLogs = raw.map(d => ({ ...d, timestamp: new Date(d.timestamp) })).sort((a,b) => b.timestamp - a.timestamp).slice(0, 20);
            updateSummaryView(); updateRecentLogView(); loadDailySales();
        };

        window.updateSummaryView = () => {
            document.getElementById('summary-date-label').textContent = getDateStr(state.viewDate);
            const summary = {}; const costMap = {};
            if(state.currentMenu) Object.values(state.currentMenu.categories).forEach(cat => cat.dishes.forEach(d => costMap[d.name] = d.cost || 0));
            let totalCost = 0; let totalWaste = 0;
            state.summaryLogs.forEach(d => {
                if(!summary[d.dish]) summary[d.dish] = {refill:0, waste:0, start:0, end:0, hasStock:false};
                if(d.type==='waste') summary[d.dish].waste += d.quantity;
                else if(d.type==='start'){ summary[d.dish].start=d.quantity; summary[d.dish].hasStock=true; }
                else if(d.type==='end'){ summary[d.dish].end=d.quantity; summary[d.dish].hasStock=true; }
                else summary[d.dish].refill += d.quantity;
            });
            const sumList = document.getElementById('summary-list');
            sumList.innerHTML = '';
            Object.keys(summary).sort().forEach(name => {
                const v = summary[name]; const c = costMap[name] || 0;
                let consume = v.refill; if(v.hasStock) consume = (v.start + v.refill) - v.end;
                totalCost += (consume < 0 ? 0 : consume) * c; totalWaste += v.waste * c;
                sumList.innerHTML += `<div class="bg-white p-4 rounded-3xl border border-gray-100 mb-2 shadow-sm"><div class="flex justify-between font-black text-[13px] mb-2 text-gray-700"><span>${name}</span><span class="text-red-500 font-mono">¥${Math.round(v.waste*c).toLocaleString()}</span></div><div class="grid grid-cols-4 gap-1 text-[10px] text-center font-black"><div class="bg-gray-50 rounded py-1">朝:${v.start}</div><div class="bg-blue-50 text-primary rounded py-1">補:${v.refill}</div><div class="bg-red-50 text-red-500 rounded py-1">廃:${v.waste}</div><div class="bg-purple-50 text-purple-600 rounded py-1">夜:${v.end}</div></div></div>`;
            });
            document.getElementById('dash-cost').textContent = `¥${Math.round(totalCost).toLocaleString()}`;
            document.getElementById('dash-waste').textContent = `¥${Math.round(totalWaste).toLocaleString()}`;
        };

        window.updateRecentLogView = () => {
            const list = document.getElementById('log-list');
            list.innerHTML = '';
            state.recentLogs.forEach(d => {
                const time = d.timestamp.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
                const icon = d.type === 'waste' ? '🗑️' : d.type === 'refill' ? '🐟' : d.type === 'start' ? '🌅' : '🌙';
                list.innerHTML += `<li class="p-3 border-b flex justify-between items-center log-${d.type} mb-1 rounded-r-2xl text-sm shadow-sm bg-white/50 backdrop-blur-sm"><div><span class="font-black text-gray-800 tracking-tight">${icon} ${d.dish}</span><br><span class="text-[10px] text-gray-400 font-bold">${time} by ${d.staffName||'?'}</span></div><span class="font-black text-gray-700 font-mono text-base">${d.quantity}${d.unit}</span></li>`;
            });
        };

        window.saveDailySales = async () => {
            const val = document.getElementById('sales-input').value; if(!val) return;
            const dStr = getDateStr(state.viewDate); state.dailySales = parseInt(val);
            if(state.isFirebaseMode) await setDoc(doc(state.db, `artifacts/${state.appId}/public/data/sales_v16_9`, dStr), { amount: parseInt(val), timestamp: serverTimestamp() });
            else { const sales = JSON.parse(localStorage.getItem('sales_v16_9') || '{}'); sales[dStr] = parseInt(val); localStorage.setItem('sales_v16_9', JSON.stringify(sales)); }
            updateSummaryView(); showMessage('売上保存完了', 'bg-green-600');
        };

        const loadDailySales = async () => {
            const dStr = getDateStr(state.viewDate); let amt = 0;
            if(state.isFirebaseMode) { const snap = await getDoc(doc(state.db, `artifacts/${state.appId}/public/data/sales_v16_9`, dStr)); if(snap.exists()) amt = snap.data().amount; }
            else { const sales = JSON.parse(localStorage.getItem('sales_v16_9') || '{}'); amt = sales[dStr] || 0; }
            state.dailySales = amt; document.getElementById('sales-input').value = amt || ''; updateSummaryView();
        };

        window.renderMenuManager = () => {
            const container = document.getElementById('menu-manager-list');
            container.innerHTML = '';
            Object.keys(state.currentMenu.categories).forEach(key => {
                const cat = state.currentMenu.categories[key];
                const div = document.createElement('div');
                div.className = 'mb-4 bg-white rounded-2xl shadow-sm border overflow-hidden';
                div.innerHTML = `<div class="p-3 bg-gray-100 border-b font-black text-xs text-gray-500 uppercase tracking-widest flex items-center gap-2"><span>${cat.icon}</span>${cat.label}</div><ul class="divide-y divide-gray-100"></ul>`;
                const ul = div.querySelector('ul');
                cat.dishes.forEach((d, i) => {
                    const li = document.createElement('li');
                    li.className = 'p-3 flex justify-between items-center text-sm gap-2';
                    li.innerHTML = `<div class="flex-1 min-w-0 active:opacity-60" onclick="window.openEditDish('${key}', ${i})"><div class="font-black truncate">${d.name}</div><div class="text-[10px] text-gray-400 font-bold tracking-tighter">¥${d.cost||0} / ${d.defaultQuantity}${d.unit}</div></div><button onclick="window.openEditDish('${key}', ${i})" class="text-primary font-black bg-blue-50 px-3 py-1.5 rounded-xl text-xs">✏️</button><button onclick="window.deleteDish('${key}', ${i})" class="text-red-500 font-black bg-red-50 px-3 py-1.5 rounded-xl text-xs">🗑️</button>`;
                    ul.appendChild(li);
                });
                const addLi = document.createElement('li');
                addLi.className = 'p-3';
                addLi.innerHTML = `<button onclick="window.openEditDish('${key}', null)" class="w-full py-2.5 border-2 border-dashed border-gray-200 text-gray-400 rounded-xl font-black text-xs active:bg-gray-50 transition">＋ 品目を追加</button>`;
                ul.appendChild(addLi);
                container.appendChild(div);
            });
        };

        // --- メニュー編集 (品目名・単位・初期数量・単価) ---
        window.openEditDish = (catKey, index) => {
            const cat = state.currentMenu.categories[catKey];
            if (!cat) return;
            const isNew = (index === null || index === undefined);
            state.editTarget = { catKey, index: isNew ? null : index };
            const d = isNew ? { name: '', unit: '', defaultQuantity: 1, cost: 0 } : cat.dishes[index];
            document.getElementById('edit-menu-title').textContent = isNew ? '品目を追加' : '品目を編集';
            document.getElementById('edit-cat-label').textContent = `${cat.icon || ''} ${cat.label}`;
            document.getElementById('edit-name').value = d.name;
            document.getElementById('edit-unit').value = d.unit;
            document.getElementById('edit-qty').value = d.defaultQuantity;
            document.getElementById('edit-cost').value = d.cost;
            document.getElementById('edit-delete-btn').classList.toggle('hidden', isNew);
            document.getElementById('edit-menu-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('edit-name').focus(), 150);
        };

        window.saveEditDish = async () => {
            const t = state.editTarget; if (!t || !t.catKey) return;
            const name = document.getElementById('edit-name').value.trim();
            const unit = document.getElementById('edit-unit').value.trim();
            const qty = parseFloat(document.getElementById('edit-qty').value);
            const cost = parseFloat(document.getElementById('edit-cost').value);
            if (!name) return alert('品目名を入力してください');
            const dish = { name, unit: unit || '個', defaultQuantity: (isNaN(qty) || qty <= 0) ? 1 : qty, cost: isNaN(cost) ? 0 : cost };
            const dishes = state.currentMenu.categories[t.catKey].dishes;
            if (t.index === null) dishes.push(dish); else dishes[t.index] = dish;
            document.getElementById('edit-menu-modal').classList.add('hidden');
            await saveMenu();
            renderMenuManager();
        };

        window.deleteEditDish = async () => {
            const t = state.editTarget; if (!t || t.catKey == null || t.index == null) return;
            if (!confirm('この品目を削除しますか？')) return;
            state.currentMenu.categories[t.catKey].dishes.splice(t.index, 1);
            document.getElementById('edit-menu-modal').classList.add('hidden');
            await saveMenu();
            renderMenuManager();
        };

        window.exportBackup = async () => {
            // 全ログを取得（recentLogs は最大20件なので使わない）
            let raw = [];
            try {
                if (state.isFirebaseMode) {
                    const path = `artifacts/${state.appId}/public/data/logs_v16_9`;
                    const snap = await getDocs(query(collection(state.db, path), orderBy('timestamp', 'desc')));
                    raw = snap.docs.map(doc => {
                        const data = doc.data();
                        return { ...data, timestamp: data.timestamp?.toDate ? data.timestamp.toDate() : null };
                    });
                } else {
                    raw = JSON.parse(localStorage.getItem('daily_logs_v16_9') || '[]')
                        .map(d => ({ ...d, timestamp: d.timestamp ? new Date(d.timestamp) : null }));
                }
            } catch (e) {
                return alert('データの取得に失敗しました');
            }

            if (raw.length === 0) return alert('データがありません');

            const esc = (s) => {
                const str = (s === undefined || s === null) ? '' : String(s);
                return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
            };

            let csv = '﻿日付,時刻,品目,数量,単位,種別,担当\n';
            raw.forEach(l => {
                const time = l.timestamp instanceof Date
                    ? l.timestamp.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
                    : '';
                csv += [l.date, time, l.dish, l.quantity, l.unit, l.type, l.staffName].map(esc).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup_${getDateStr(new Date())}.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        };

        window.saveMenu = async () => {
            if (state.isFirebaseMode) await setDoc(doc(state.db, `artifacts/${state.appId}/public/data/menu_config_v16_9`, 'config'), { config: state.currentMenu });
            else localStorage.setItem('tracker_menu_v16_9', JSON.stringify(state.currentMenu));
            renderUI(); showMessage('保存完了', 'bg-primary');
        };

        window.switchTab = (tab) => {
            if ((tab === 'report' || tab === 'settings') && !state.isAdmin) { window.openPinModal(tab); return; }
            ['tracker', 'summary', 'report', 'settings'].forEach(t => document.getElementById(`${t}-view`)?.classList.add('hidden'));
            document.getElementById(`${tab}-view`)?.classList.remove('hidden');
            if(tab === 'settings') renderMenuManager();
            if(tab === 'summary') { updateSummaryView(); loadDailySales(); }
        };
        window.openPinModal = (t) => { state.targetTab = t; state.pinBuffer = ''; document.getElementById('pin-modal').classList.remove('hidden'); document.getElementById('pin-display').value = ''; };
        window.inputPin = (n) => { if(state.pinBuffer.length>=4)return; state.pinBuffer+=n; document.getElementById('pin-display').value='*'.repeat(state.pinBuffer.length); if(state.pinBuffer.length===4) setTimeout(()=>{ if(state.pinBuffer==='1129'){state.isAdmin=true; document.getElementById('pin-modal').classList.add('hidden'); if(state.targetTab)window.switchTab(state.targetTab);}else{alert('NG');state.pinBuffer='';document.getElementById('pin-display').value='';}},200); };
        window.deleteDish = async (k, i) => { if(confirm('削除しますか？')){ state.currentMenu.categories[k].dishes.splice(i,1); await saveMenu(); } };

        window.onload = () => { initApp(); };
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans pb-[100px] text-gray-900 overflow-hidden">

    <!-- 記録モーダル -->
    <div id="quantity-modal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">

            <div id="quick-buttons-area" class="grid grid-cols-3 gap-2 mb-8"></div>

    <!-- メニュー編集モーダル -->
    <div id="edit-menu-modal" class="fixed inset-0 bg-black/80 z-[120] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm p-6 rounded-[40px] shadow-2xl flex flex-col">
            <div class="flex justify-between items-center mb-1">
                <span id="edit-menu-title" class="text-lg font-black text-gray-800 tracking-tight">品目を編集</span>
                <button onclick="document.getElementById('edit-menu-modal').classList.add('hidden')" class="text-2xl p-1 text-gray-300">×</button>
            </div>
            <p id="edit-cat-label" class="text-[10px] font-black text-primary uppercase tracking-widest mb-5"></p>
            <div class="space-y-4">
                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest ml-1">品目名</label>
                    <input type="text" id="edit-name" class="w-full mt-1 bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 text-sm font-black text-gray-800 focus:bg-white focus:ring-2 focus:ring-primary outline-none">

                        <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest ml-1">単位</label>

                    <div>
                        <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest ml-1">初期数量</label>

                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest ml-1">単価（円）</label>
                    <input type="number" id="edit-cost" class="w-full mt-1 bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 text-sm font-black text-primary focus:bg-white focus:ring-2 focus:ring-primary outline-none">

            <div class="flex gap-3 mt-7">

                <button onclick="window.saveEditDish()" class="flex-1 py-4 bg-primary text-white font-black rounded-2xl shadow-md active:scale-95 uppercase tracking-widest text-sm">保存</button>

        </div>
    </div>

    <!-- メイン -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative flex flex-col">
        <header class="bg-white/95 backdrop-blur-md p-4 sticky top-0 z-50 border-b no-print">
            <div class="flex justify-between items-center mb-3">
                <div class="flex flex-col">
                    <h1 class="text-xl font-black text-gray-900 leading-none tracking-tighter flex items-center gap-1 uppercase">🦞 Susukino MASTER <span class="text-[9px] bg-primary/10 text-primary px-1.5 py-0.5 rounded ml-1 font-black">V16.9</span></h1>
                    <div class="flex items-center gap-2 mt-1 text-[8px]">
                        <span id="status-badge" class="bg-gray-400 text-white px-2 py-0.5 rounded-full font-bold uppercase tracking-widest">...</span>
                        <button onclick="window.changeStaffName()" id="current-staff-name" class="font-black text-primary underline decoration-primary/30 tracking-tight">ゲスト</button>

            </div>
            <div class="relative mb-4">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>

        <main id="main-content" class="flex-1 overflow-y-auto bg-white">
            <!-- 記録ビュー -->
            <div id="tracker-view" class="p-4 no-print animate-fade-in pb-24">

                <div class="mt-12 border-t-2 border-dashed border-gray-100 pt-8">

            <!-- 日計ビュー -->
            <div id="summary-view" class="p-4 hidden no-print bg-gray-50 flex-1 min-h-screen">
                <div class="sticky top-0 z-40 space-y-3 mb-6 bg-gray-50 pb-4 border-b border-gray-200">
                    <div class="bg-gray-900 text-white p-5 rounded-[40px] shadow-xl flex justify-between items-center">

                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2 leading-none">Revenue</span>
                        <input type="number" id="sales-input" class="flex-1 text-right text-2xl font-black text-primary outline-none bg-transparent" placeholder="0">
                        <button onclick="window.saveDailySales()" class="bg-primary text-white text-[10px] font-black px-6 py-3 rounded-2xl shadow-lg">SAVE</button>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-gray-800 font-black">
                        <div class="bg-white p-4 rounded-3xl border shadow-sm flex flex-col items-center">
                            <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Food Cost</span>
                            <span id="dash-cost" class="text-xl tracking-tighter">¥0</span>
                        </div>
                        <div class="bg-white p-4 rounded-3xl border shadow-sm flex flex-col items-center">
                            <span class="text-[9px] font-black text-gray-400 uppercase mb-1 text-red-500">Waste Loss</span>
                            <span id="dash-waste" class="text-xl tracking-tighter">¥0</span>
                        </div>
                    </div>
                </div>
                <div id="summary-list" class="space-y-2 pb-32"></div>
            </div>

            <!-- 設定ビュー -->
            <div id="settings-view" class="p-4 hidden no-print bg-gray-50 flex-1 min-h-screen pb-32 text-center">
                <div class="bg-white p-10 rounded-[48px] shadow-sm border mb-8 flex flex-col gap-4">
                    <button onclick="window.exportBackup()" class="w-full py-5 bg-white border-2 border-gray-100 text-gray-700 rounded-3xl font-black uppercase text-xs tracking-widest active:bg-gray-50 transition">💾 CSV Export</button>
                </div>
                <div id="menu-manager-list" class="text-left"></div>
                <button onclick="if(confirm('完全に初期化しますか？')){localStorage.clear();location.reload();}" class="text-[10px] text-gray-300 uppercase font-black tracking-widest underline decoration-gray-200 mt-12">Critical Reset</button>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-100 z-50 pb-safe no-print max-w-md mx-auto shadow-2xl">
            <div class="flex justify-around p-4">
                <button onclick="window.switchTab('tracker')" class="flex-1 flex flex-col items-center gap-1 text-primary"><span class="text-3xl leading-none">📝</span><span class="text-[9px] font-black uppercase tracking-widest">Home</span></button>
                <button onclick="window.switchTab('summary')" class="flex-1 flex flex-col items-center gap-1 text-gray-300"><span class="text-3xl leading-none">📊</span><span class="text-[9px] font-black uppercase tracking-widest">Stats</span></button>
                <button onclick="window.switchTab('settings')" class="flex-1 flex flex-col items-center gap-1 text-gray-300"><span class="text-3xl leading-none">⚙️</span><span class="text-[9px] font-black uppercase tracking-widest">Set</span></button>
            </div>
        </nav>
    </div>
</body>
</html>
