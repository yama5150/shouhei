<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0612">
<title>紅夜 — Motion</title>
<style>
  :root { --ink:#f3e6ee; --dim:#b89aae; --accent:#c2185b; --bg:#07040b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; overflow:hidden;
    -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #view { height:100%; width:auto; max-width:100%; aspect-ratio:9/16; object-fit:contain; display:block; }
  @media (max-aspect-ratio: 9/16) { #view { width:100%; height:auto; } }
  #ui { position:fixed; left:0; right:0; bottom:0; padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(7,4,11,.85)); transition:opacity .4s; }
  #ui.hidden { opacity:0; pointer-events:none; }
  button { font:inherit; font-size:14px; color:var(--ink); background:rgba(40,16,36,.7);
    border:1px solid rgba(194,24,91,.55); border-radius:999px; padding:10px 16px; min-height:44px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  button:active { background:rgba(194,24,91,.45); }
  button[disabled] { opacity:.5; }
  #status { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:0; right:0; text-align:center;
    font-size:13px; color:var(--dim); letter-spacing:.1em; pointer-events:none; transition:opacity .4s; }
  #status a { color:var(--ink); pointer-events:auto; }
  #status.hidden { opacity:0; }
</style>
</head>
<body>
<div id="stage"><canvas id="view" width="1080" height="1920"></canvas></div>
<div id="status">画面をタップで操作パネルを隠す</div>
<div id="ui">
  <button id="play">一時停止</button>
  <button id="rec">1ループ書き出し(12秒)</button>
  <button id="fs">全画面</button>
</div>
<img id="src" alt="" hidden src="__BASE_IMAGE__">
<script>
(() => {
'use strict';
const W = 1080, H = 1920;
const LOOP = 12;              // 秒。すべての動きはこの周期で継ぎ目なく繋がる
const TAU = Math.PI * 2;

const view = document.getElementById('view');
const ctx = view.getContext('2d');

// ---------- WebGL: 下絵の揺らぎ(髪・袖・水面・提灯・花火の照り返し) ----------
const glc = document.createElement('canvas');
glc.width = W; glc.height = H;
const gl = glc.getContext('webgl', { preserveDrawingBuffer:true, premultipliedAlpha:false });

const VS = `attribute vec2 p; varying vec2 v;
void main(){ v = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;

// 座標は画像を 0..1 に正規化(左上原点)。部位の範囲は下絵に合わせて手で決めている
const FS = `precision highp float;
varying vec2 v;
uniform sampler2D img;
uniform float ph;        // ループ位相 0..1
uniform vec4 flash;      // rgb, 強さ
uniform vec2 flashPos;
const float TAU = 6.2831853;

float box(vec2 u, vec2 a, vec2 b, float s){
  vec2 lo = smoothstep(a-s, a+s, u);
  vec2 hi = 1.-smoothstep(b-s, b+s, u);
  return lo.x*lo.y*hi.x*hi.y;
}
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }

void main(){
  // カメラ:ゆっくり寄って引く呼吸
  float z = 1.035 + .012*sin(TAU*ph);
  vec2 c = vec2(.5 + .006*sin(TAU*ph + 1.3), .5 + .004*cos(TAU*ph));
  vec2 u = (v - .5)/z + c;

  vec2 off = vec2(0.);

  // 髪:右へ流れる毛先。頭から離れるほど大きく揺れる
  float hm = box(u, vec2(.60,.34), vec2(1.02,.82), .05);
  float hw = smoothstep(.60,.95,u.x) * (.4 + .6*smoothstep(.34,.70,u.y));
  off.x += hm*hw*.0065*sin(TAU*(2.*ph) - u.y*9. - u.x*6.);
  off.y += hm*hw*.0030*sin(TAU*(3.*ph) - u.x*11.);

  // 肩から背中の髪:控えめなうねり
  float hb = box(u, vec2(.40,.36), vec2(.62,.95), .04);
  off.x += hb*.0020*sin(TAU*(2.*ph) - u.y*14. + 1.);

  // 袖:左下へ翻る
  float sm = box(u, vec2(-.02,.60), vec2(.40,1.02), .05) * smoothstep(.40,.08,u.x);
  off.x += sm*.0050*sin(TAU*(3.*ph) - u.y*7. + u.x*5.);
  off.y += sm*.0035*sin(TAU*(2.*ph) + u.x*9.);

  // 髪飾りの房:振り子
  float tm = box(u, vec2(.655,.33), vec2(.725,.46), .012);
  off.x += tm*.0045*sin(TAU*(2.*ph) + .6)*smoothstep(.33,.46,u.y);

  // 水面:縦に帯状のさざ波で映り込みが揺れる
  float wm = max(max(box(u, vec2(-.02,.40), vec2(.36,.585), .02),
                     box(u, vec2(-.02,.615), vec2(.30,.72), .02)),
                     box(u, vec2(-.02,.80), vec2(.30,1.02), .03));
  wm *= 1. - sm*.8;
  off.x += wm*(.0022*sin(u.y*260. + TAU*6.*ph) + .0012*sin(u.y*97. - TAU*4.*ph + u.x*20.));

  vec3 col = texture2D(img, clamp(u - off, .001, .999)).rgb;

  // 水面のきらめき
  float spark = step(.9965, hash(floor(u*vec2(240.,480.)) + floor(ph*48.)));
  col += wm * spark * vec3(1.,.6,.85) * .55;

  // 提灯のゆらめき
  float flick = .55 + .20*sin(TAU*7.*ph) + .15*sin(TAU*13.*ph + 1.7) + .10*sin(TAU*29.*ph + .4);
  vec2 ld = (u - vec2(.885,.255)) / vec2(.085,.065);
  float lg = exp(-dot(ld,ld)*.9);
  col *= 1. + lg*flick*.35;
  col += lg*flick*vec3(1.,.38,.48)*.08;
  vec2 lh = (u - vec2(.885,.255)) / vec2(.30,.20);
  col += exp(-dot(lh,lh)*1.5)*flick*vec3(.55,.12,.22)*.05;

  // 下絵の花火も瞬かせる
  vec2 f1 = (u - vec2(.24,.12))/.10;  col *= 1. + exp(-dot(f1,f1)*1.2)*(.25+.25*sin(TAU*5.*ph));
  vec2 f2 = (u - vec2(.235,.23))/.06; col *= 1. + exp(-dot(f2,f2)*1.2)*(.30+.30*sin(TAU*4.*ph+2.));
  vec2 f3 = (u - vec2(.37,.255))/.02; col *= 1. + exp(-dot(f3,f3))*(.5+.5*sin(TAU*9.*ph));

  // 打ち上げ花火の照り返し:空と水面、少し人物にも
  vec2 fd = (u - flashPos)/vec2(.55,.35);
  float fall = exp(-dot(fd,fd));
  float lum = dot(col, vec3(.3,.5,.2));
  col += flash.rgb*flash.a*(fall*.20 + .03)*(.35 + lum*2.);
  col += flash.rgb*flash.a*wm*.10;

  // 周辺減光と粒子感
  vec2 q = v - .5;
  col *= 1. - dot(q,q)*.55;
  col += (hash(v*vec2(W_,H_) + ph*97.) - .5)*.025;

  gl_FragColor = vec4(col, 1.);
}`.replace('W_', W.toFixed(1)).replace('H_', H.toFixed(1));

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(aP);
gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const uPh = U('ph'), uFlash = U('flash'), uFlashPos = U('flashPos');

// ---------- 決定的な乱数 ----------
function rng(seed){
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const mod = (a, n) => ((a % n) + n) % n;

// ---------- 打ち上げ花火 ----------
// 夜空は画面左上。人物の頭(x>0.42)に掛からない範囲で上げる
const PALETTE = {
  crimson:[255, 70,110], rose:[255,120,170], violet:[190,120,255],
  gold:[255,205,130], pink:[255,170,215],
};
const SHOWS = [
  { t:0.6, x:.20, y:.13, r:.100, kind:'peony',  c:'crimson', c2:'pink'  },
  { t:2.9, x:.10, y:.07, r:.075, kind:'ring',   c:'violet',  c2:'violet'},
  { t:4.4, x:.30, y:.09, r:.090, kind:'willow', c:'gold',    c2:'gold'  },
  { t:6.8, x:.15, y:.17, r:.085, kind:'peony',  c:'rose',    c2:'violet'},
  { t:8.3, x:.33, y:.16, r:.065, kind:'peony',  c:'pink',    c2:'crimson'},
  { t:9.6, x:.08, y:.12, r:.095, kind:'willow', c:'crimson', c2:'gold'  },
];
const RISE = 0.9;
SHOWS.forEach((s, i) => {
  const r = rng(1000 + i*77);
  const n = s.kind === 'ring' ? 60 : s.kind === 'willow' ? 70 : 95;
  s.life = s.kind === 'willow' ? 2.8 : 2.0;
  s.p = [];
  for (let k = 0; k < n; k++) {
    let a, sp;
    if (s.kind === 'ring') { a = k/n*TAU; sp = .92 + r()*.08; }
    else { a = r()*TAU; sp = Math.sqrt(r())*.8 + .2; }
    s.p.push({ a, sp, tw:r()*TAU, c: r() < .75 ? s.c : s.c2 });
  }
  s.x0 = s.x + (r()-.5)*.04;
});

function burstPos(s, p, age){
  const k = s.kind === 'willow' ? 1.6 : 2.6;
  const d = (1 - Math.exp(-age*k)) * s.r * p.sp;
  const g = (s.kind === 'willow' ? .020 : .010) * age*age;
  return [s.x + Math.cos(p.a)*d, s.y + Math.sin(p.a)*d*(W/H)*1.0 + g];
}

function drawFireworks(T){
  let flash = [0,0,0,0], fx = .2, fy = .12;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const s of SHOWS) {
    const a = mod(T - s.t + RISE, LOOP) - RISE;
    if (a >= s.life) continue;
    if (a < 0) { // 上昇
      const k = 1 + a/RISE;                 // 0..1
      const e = 1 - Math.pow(1-k, 2.2);
      const y0 = .33, x = s.x0 + (s.x - s.x0)*e;
      const y = y0 + (s.y - y0)*e;
      const yb = y0 + (s.y - y0)*Math.max(0, e - .12);
      const g = ctx.createLinearGradient(0, yb*H, 0, y*H);
      g.addColorStop(0, 'rgba(255,190,150,0)'); g.addColorStop(1, 'rgba(255,220,190,.9)');
      ctx.strokeStyle = g; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(x*W, yb*H); ctx.lineTo(x*W, y*H); ctx.stroke();
      continue;
    }
    // 開花
    const fade = Math.pow(1 - a/s.life, 1.6);
    const f = Math.exp(-a*5) ;
    if (f*1.0 > flash[3]) { const c = PALETTE[s.c]; flash = [c[0]/255, c[1]/255, c[2]/255, f]; fx = s.x; fy = s.y; }
    // 中心の閃光
    if (a < .25) {
      const g = ctx.createRadialGradient(s.x*W, s.y*H, 0, s.x*W, s.y*H, s.r*W*.9);
      g.addColorStop(0, `rgba(255,235,240,${.55*(1-a/.25)})`); g.addColorStop(1, 'rgba(255,120,170,0)');
      ctx.fillStyle = g; ctx.fillRect((s.x-s.r)*W, s.y*H-s.r*W, s.r*W*2, s.r*W*2);
    }
    const trail = s.kind === 'willow' ? .45 : .16;
    for (const p of s.p) {
      const [x1, y1] = burstPos(s, p, a);
      const [x0, y0] = burstPos(s, p, Math.max(0, a - trail));
      const c = PALETTE[p.c];
      const tw = a > s.life*.55 ? (.5 + .5*Math.sin(a*40 + p.tw)) : 1;
      const al = fade * tw;
      if (al < .02) continue;
      const g = ctx.createLinearGradient(x0*W, y0*H, x1*W, y1*H);
      g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0)`);
      g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},${al})`);
      ctx.strokeStyle = g; ctx.lineWidth = s.kind === 'willow' ? 1.8 : 2.4;
      ctx.beginPath(); ctx.moveTo(x0*W, y0*H); ctx.lineTo(x1*W, y1*H); ctx.stroke();
      ctx.fillStyle = `rgba(255,240,245,${al*.9})`;
      ctx.beginPath(); ctx.arc(x1*W, y1*H, 1.6, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
  return { flash, fx, fy };
}

// ---------- 花びら ----------
const PETALS = [];
{
  const r = rng(42);
  for (let i = 0; i < 34; i++) {
    const depth = r();                       // 0 奥 .. 1 手前
    PETALS.push({
      o: r(), x0: r()*1.1 - .05, passes: depth > .8 ? 2 : 1,
      amp: .02 + r()*.05, sw: 1 + (r()*3|0), sp: r()*TAU,
      drift: -.08 - r()*.18, spin: 2 + (r()*4|0), rot: r()*TAU,
      size: 6 + depth*depth*26, depth,
      hue: r() < .7 ? [255,150,190] : [220,60,110],
    });
  }
  PETALS.sort((a, b) => a.depth - b.depth);
}
function drawPetals(ph){
  for (const p of PETALS) {
    const q = mod(p.o + ph*p.passes, 1);
    const y = -.06 + q*1.12;
    const x = p.x0 + p.drift*q + p.amp*Math.sin(TAU*p.sw*ph + p.sp);
    const ang = p.rot + TAU*p.spin*ph;
    const flip = Math.cos(TAU*p.spin*ph + p.sp);
    const s = p.size;
    ctx.save();
    ctx.translate(x*W, y*H);
    ctx.rotate(ang);
    ctx.scale(Math.max(.15, Math.abs(flip)), 1);
    const al = .35 + p.depth*.55;
    const g = ctx.createRadialGradient(0, -s*.2, 0, 0, 0, s);
    const [cr, cg, cb] = p.hue;
    g.addColorStop(0, `rgba(255,225,238,${al})`);
    g.addColorStop(.6, `rgba(${cr},${cg},${cb},${al*.85})`);
    g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle = g;
    if (p.depth > .85) ctx.filter = `blur(${((p.depth-.85)*30).toFixed(1)}px)`;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s*.75, -s*.55, s*.6, s*.55, 0, s);
    ctx.bezierCurveTo(-s*.6, s*.55, -s*.75, -s*.55, 0, -s);
    ctx.fill();
    ctx.restore();
  }
}

// ---------- 光の粒(水面から立ち上る蛍火) ----------
const MOTES = [];
{
  const r = rng(7);
  for (let i = 0; i < 40; i++) MOTES.push({
    o:r(), x:r()*.45, y0:.45 + r()*.5, rise:.12 + r()*.2, tw:1 + (r()*5|0), sp:r()*TAU, s:1 + r()*2.5,
  });
}
function drawMotes(ph){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const m of MOTES) {
    const q = mod(m.o + ph, 1);
    const x = m.x + .01*Math.sin(TAU*2*ph + m.sp);
    const y = m.y0 - m.rise*q;
    const a = Math.sin(Math.PI*q) * (.5 + .5*Math.sin(TAU*m.tw*ph + m.sp));
    const g = ctx.createRadialGradient(x*W, y*H, 0, x*W, y*H, m.s*5);
    g.addColorStop(0, `rgba(255,190,225,${.8*a})`); g.addColorStop(1, 'rgba(255,120,180,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x*W - m.s*5, y*H - m.s*5, m.s*10, m.s*10);
  }
  ctx.restore();
}

// ---------- 1フレーム描画 ----------
function render(T){
  const ph = mod(T, LOOP) / LOOP;
  const T2 = mod(T, LOOP);
  // 花火を先に計算して照り返しの色を決める(描画は下絵の後)
  ctx.clearRect(0, 0, W, H);
  const probe = fireworkFlash(T2);
  gl.uniform1f(uPh, ph);
  gl.uniform4f(uFlash, probe.flash[0], probe.flash[1], probe.flash[2], probe.flash[3]);
  gl.uniform2f(uFlashPos, probe.fx, probe.fy);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ctx.drawImage(glc, 0, 0);
  drawFireworks(T2);
  drawMotes(ph);
  drawPetals(ph);
}
function fireworkFlash(T){
  let best = { flash:[0,0,0,0], fx:.2, fy:.12 };
  for (const s of SHOWS) {
    const a = mod(T - s.t + RISE, LOOP) - RISE;
    if (a < 0 || a >= s.life) continue;
    const f = Math.exp(-a*5);
    if (f > best.flash[3]) { const c = PALETTE[s.c]; best = { flash:[c[0]/255, c[1]/255, c[2]/255, f], fx:s.x, fy:s.y }; }
  }
  return best;
}

// ---------- 再生・UI ----------
let playing = true, clock = 0, last = performance.now(), recorder = null;
function tick(now){
  const dt = Math.min(.1, (now - last)/1000); last = now;
  if (playing) clock += dt;
  render(clock);
  requestAnimationFrame(tick);
}

const img = document.getElementById('src');
function start(){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.viewport(0, 0, W, H);
  requestAnimationFrame(tick);
}
if (img.complete && img.naturalWidth) start(); else img.onload = start;

// 検証・静止画書き出し用
window.__motion = { render, LOOP, setPlaying:v => { playing = v; }, setClock:t => { clock = t; } };

const ui = document.getElementById('ui'), status = document.getElementById('status');
const bPlay = document.getElementById('play'), bRec = document.getElementById('rec'), bFs = document.getElementById('fs');
document.getElementById('stage').addEventListener('click', () => {
  if (recorder) return;
  ui.classList.toggle('hidden'); status.classList.add('hidden');
});
bPlay.onclick = () => { playing = !playing; bPlay.textContent = playing ? '一時停止' : '再生'; };
bFs.onclick = () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else ui.classList.add('hidden');
};

function pickMime(){
  const c = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return window.MediaRecorder ? c.find(m => MediaRecorder.isTypeSupported(m)) : null;
}
if (!pickMime() || !view.captureStream) { bRec.disabled = true; bRec.textContent = '書き出し非対応のブラウザ'; }

bRec.onclick = () => {
  const mime = pickMime();
  const stream = view.captureStream(30);
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType:mime, videoBitsPerSecond:16e6 });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type:mime });
    const url = URL.createObjectURL(blob);
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = url; a.download = `koya-motion.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    status.innerHTML = `書き出し完了 — <a href="${url}" download="koya-motion.${ext}">保存し直す</a>`;
    status.classList.remove('hidden');
    ui.classList.remove('hidden');
    bRec.disabled = false; recorder = null;
  };
  // ループの頭から12秒ちょうどを収める
  clock = 0; playing = true; bPlay.textContent = '一時停止';
  ui.classList.add('hidden');
  status.textContent = '書き出し中…'; status.classList.remove('hidden');
  bRec.disabled = true;
  recorder.start();
  setTimeout(() => recorder && recorder.stop(), LOOP*1000);
};
})();
</script>
</body>
</html>
